name: Multi-Target Patch and Build Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-matrix:
    name: Build ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gdevelop
            os: ubuntu-latest
            artifact_path: submodules/gdevelop/newIDE/electron-app/dist/*.AppImage
            artifact_name: GDevelop-Unlocked-Linux.AppImage
          - target: gdevelop
            os: windows-latest
            artifact_path: submodules/gdevelop/newIDE/electron-app/dist/*.exe
            artifact_name: GDevelop-Unlocked-Setup.exe
          - target: litellm-gateway
            os: ubuntu-latest
            artifact_path: build/litellm*
            artifact_name: litellm-unlocked-wheel.whl
          - target: bifrost
            os: ubuntu-latest
            artifact_path: build/bifrost-linux-amd64
            artifact_name: bifrost-linux-amd64
          - target: monsterinsights
            os: ubuntu-latest
            artifact_path: build/monsterinsights-pro-unlocked.zip
            artifact_name: monsterinsights-pro-unlocked.zip

    steps:
      - name: Checkout Meta-Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Initialize Node.js Environment
        if: matrix.target == 'gdevelop' || matrix.target == 'monsterinsights'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Go Environment
        if: matrix.target == 'bifrost'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Initialize Python Environment
        if: matrix.target == 'litellm-gateway'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Patch Engine
        run: |
          chmod +x ./scripts/apply-patches.sh
          ./scripts/apply-patches.sh ${{ matrix.target }}

      - name: Compile GDevelop App
        if: matrix.target == 'gdevelop'
        shell: bash
        run: |
          if [ -d "submodules/gdevelop/newIDE/electron-app" ]; then
            cd submodules/gdevelop/newIDE/app
            npm install --legacy-peer-deps || yarn install
            npm run build || yarn build || true
            cd ../electron-app
            npm install --legacy-peer-deps || yarn install
            if [ "${{ runner.os }}" == "Windows" ]; then
              export GD_PORTABLE_BUILD=true
              npm run build -- --publish never
            else
              GD_PORTABLE_BUILD=true npm run build -- --publish never
            fi
          fi

      - name: Compile LiteLLM Package
        if: matrix.target == 'litellm-gateway'
        run: |
          mkdir -p build
          if [ -d "submodules/litellm" ]; then
            cd submodules/litellm
            python -m pip install --upgrade build
            python -m build --wheel --outdir "../../build/"
          fi

      - name: Compile Bifrost Service
        if: matrix.target == 'bifrost'
        run: |
          mkdir -p build
          if [ -d "submodules/bifrost" ]; then
            cd submodules/bifrost
            CGO_ENABLED=1 go build -ldflags="-s -w" -o "../../build/bifrost-linux-amd64" ./transports/bifrost-http || CGO_ENABLED=0 go build -ldflags="-s -w" -o "../../build/bifrost-linux-amd64" ./transports/bifrost-http || true
          fi

      - name: Package MonsterInsights
        if: matrix.target == 'monsterinsights'
        run: |
          mkdir -p build
          if [ -d "submodules/monsterinsights" ]; then
            cd submodules/monsterinsights
            npm install && npm run build || true
            zip -r "../../build/monsterinsights-pro-unlocked.zip" . -x "*.git*" "node_modules/*"
          fi

      - name: Upload Runner Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ runner.os }}-artifact
          path: ${{ matrix.artifact_path }}

  build-containers:
    name: Build & Push Unlocked Docker Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Meta-Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Patch Engine (LiteLLM)
        run: |
          chmod +x ./scripts/apply-patches.sh
          ./scripts/apply-patches.sh litellm-gateway

      - name: Build & Push LiteLLM Gateway Image
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -f "submodules/litellm/Dockerfile" ]; then
            docker build -t "ghcr.io/${OWNER_LC}/litellm-gateway:unlocked" -f submodules/litellm/Dockerfile submodules/litellm
            docker push "ghcr.io/${OWNER_LC}/litellm-gateway:unlocked"
          else
            echo "LiteLLM Dockerfile not present in submodule."
            exit 1
          fi

      - name: Execute Patch Engine (Bifrost)
        run: |
          ./scripts/apply-patches.sh bifrost

      - name: Build & Push Bifrost Gateway Image
        shell: bash
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -f "submodules/bifrost/transports/Dockerfile.local" ]; then
            docker build -t "ghcr.io/${OWNER_LC}/bifrost:unlocked" -f submodules/bifrost/transports/Dockerfile.local submodules/bifrost
            docker push "ghcr.io/${OWNER_LC}/bifrost:unlocked"
          elif [ -f "submodules/bifrost/transports/Dockerfile" ]; then
            docker build -t "ghcr.io/${OWNER_LC}/bifrost:unlocked" -f submodules/bifrost/transports/Dockerfile submodules/bifrost
            docker push "ghcr.io/${OWNER_LC}/bifrost:unlocked"
          elif [ -f "submodules/bifrost/Dockerfile" ]; then
            docker build -t "ghcr.io/${OWNER_LC}/bifrost:unlocked" -f submodules/bifrost/Dockerfile submodules/bifrost
            docker push "ghcr.io/${OWNER_LC}/bifrost:unlocked"
          else
            echo "Bifrost Dockerfile not present in submodule."
            exit 1
          fi

  publish-release:
    name: Generate GitHub Release
    needs: [build-matrix, build-containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Compiled Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-vendor

      - name: Compute Cryptographic Hashes
        run: |
          mkdir -p dist
          find release-vendor/ -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish Build Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-v${{ github.run_number }}
          name: Automated Patch Build Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
